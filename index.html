<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TVPlayer · 云端影视</title>
    <script src="/hls.min.js"></script>
    <style>
        /* ============================================================
                   爱奇艺风格 · 从零重构
                   ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #0a0c12;
            --header-bg: #11161f;
            --card-bg: #181e2a;
            --card-hover: #212837;
            --border: #2a3242;
            --text: #eef1f5;
            --text2: #8991a8;
            --text3: #4a5368;
            --primary: #ff6a00;
            --primary-dim: rgba(255, 106, 0, 0.15);
            --gold: #f5b342;
            --green: #2ed573;
            --radius: 8px;
            --shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        button {
            cursor: pointer;
            border: none;
            outline: none;
            background: none;
            color: inherit;
            font: inherit;
        }
        input,
        select {
            font: inherit;
            outline: none;
            border: none;
            background: none;
            color: inherit;
        }
        img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--text3);
            border-radius: 4px;
        }

        /* ===== Toast ===== */
        #toast-container {
            position: fixed;
            top: 72px;
            right: 16px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 340px;
            pointer-events: none;
        }
        .toast {
            padding: 10px 16px;
            border-radius: 6px;
            background: var(--header-bg);
            border: 1px solid var(--border);
            color: var(--text2);
            font-size: 13px;
            box-shadow: var(--shadow);
            pointer-events: auto;
            animation: toastIn 0.25s ease;
        }
        .toast.success {
            border-left: 3px solid var(--green);
            color: var(--text);
        }
        .toast.error {
            border-left: 3px solid #e74c3c;
            color: var(--text);
        }
        .toast.info {
            border-left: 3px solid var(--primary);
            color: var(--text);
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ===== Header ===== */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border);
            padding: 8px 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 12px;
        }
        .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            white-space: nowrap;
            letter-spacing: -0.3px;
        }
        .logo span {
            color: var(--primary);
        }

        .nav-tabs {
            display: flex;
            gap: 2px;
            background: var(--bg);
            border-radius: 6px;
            padding: 2px;
        }
        .nav-tabs button {
            padding: 4px 16px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text2);
            transition: 0.2s;
        }
        .nav-tabs button.active {
            background: var(--primary);
            color: #fff;
        }
        .nav-tabs button:hover:not(.active) {
            color: var(--text);
        }

        .controls {
            display: flex;
            flex: 1;
            min-width: 160px;
            align-items: center;
            gap: 6px;
        }
        .controls select {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 13px;
            color: var(--text);
            min-width: 70px;
            max-width: 120px;
            cursor: pointer;
        }
        .controls select option {
            background: var(--header-bg);
        }
        .controls input {
            flex: 1;
            min-width: 50px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 13px;
            color: var(--text);
            transition: 0.2s;
        }
        .controls input:focus {
            border-color: var(--primary);
        }
        .controls input::placeholder {
            color: var(--text3);
        }

        .btn {
            padding: 4px 14px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            transition: 0.2s;
            white-space: nowrap;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            opacity: 0.85;
        }
        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-ghost {
            color: var(--text2);
            border: 1px solid transparent;
            padding: 3px 10px;
        }
        .btn-ghost:hover {
            color: var(--text);
            border-color: var(--border);
        }

        #status {
            font-size: 12px;
            color: var(--text3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 120px;
            margin-left: auto;
        }
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== Main ===== */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 12px 16px 0;
        }

        /* ============================================================
                   播放器
                   ============================================================ */
        #player-section {
            display: none;
            margin-bottom: 16px;
            background: #000;
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
            position: relative;
        }
        #player-section.open {
            display: block;
        }
        #player-section video {
            width: 100%;
            max-height: 58vh;
            background: #000;
            display: block;
        }
        #player-iframe {
            width: 100%;
            height: 58vh;
            border: none;
            display: none;
            background: #000;
        }

        .player-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 12px;
            padding: 8px 14px;
            background: rgba(0, 0, 0, 0.9);
            border-top: 1px solid var(--border);
            font-size: 13px;
            color: var(--text2);
        }
        .player-controls .title {
            flex: 1;
            min-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text);
            font-size: 14px;
        }
        .player-controls .speed-group {
            display: flex;
            gap: 2px;
        }
        .player-controls .speed-group button {
            padding: 1px 7px;
            border-radius: 3px;
            font-size: 12px;
            color: var(--text3);
            border: 1px solid transparent;
            transition: 0.2s;
        }
        .player-controls .speed-group button.active {
            color: var(--primary);
            border-color: var(--primary);
            background: var(--primary-dim);
        }
        .player-controls .speed-group button:hover:not(.active) {
            color: var(--text);
        }
        .player-controls .ctrl-btn {
            padding: 2px 6px;
            font-size: 18px;
            color: var(--text3);
            border-radius: 4px;
            transition: 0.2s;
            line-height: 1.4;
        }
        .player-controls .ctrl-btn:hover {
            color: var(--text);
            background: var(--card-bg);
        }
        .player-controls .ctrl-btn.close-btn:hover {
            color: #e74c3c;
        }
        .player-controls .link-input {
            flex: 1;
            min-width: 100px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 12px;
            color: var(--text3);
        }
        .player-controls .link-input:focus {
            border-color: var(--primary);
        }

        /* ===== 选集面板（悬浮在播放器右下角） ===== */
        #episodes-panel {
            display: none;
            position: absolute;
            bottom: 70px;
            right: 12px;
            background: rgba(0, 0, 0, 0.92);
            border-radius: 8px;
            padding: 12px 14px;
            max-height: 320px;
            overflow-y: auto;
            min-width: 180px;
            max-width: 260px;
            z-index: 20;
            border: 1px solid var(--border);
            backdrop-filter: blur(8px);
        }
        #episodes-panel::-webkit-scrollbar {
            width: 3px;
        }
        #episodes-panel::-webkit-scrollbar-thumb {
            background: var(--text3);
            border-radius: 4px;
        }
        #episodes-panel .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            color: var(--text2);
            font-size: 13px;
            font-weight: 500;
        }
        #episodes-panel .panel-header button {
            color: var(--text3);
            font-size: 16px;
            padding: 0 4px;
        }
        #episodes-panel .panel-header button:hover {
            color: var(--text);
        }
        #episodes-panel .ep-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        #episodes-panel .ep-list .ep {
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 13px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text2);
            cursor: pointer;
            transition: 0.2s;
            min-width: 36px;
            text-align: center;
        }
        #episodes-panel .ep-list .ep:hover {
            border-color: var(--text3);
            color: var(--text);
        }
        #episodes-panel .ep-list .ep.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }
        #episodes-panel .ep-list .ep-loading {
            color: var(--text3);
            font-size: 13px;
            padding: 4px 0;
        }

        /* 播放器下方的信息栏 */
        #player-info {
            display: none;
            padding: 10px 14px;
            background: var(--card-bg);
            border-top: 1px solid var(--border);
            border-radius: 0 0 var(--radius) var(--radius);
        }
        #player-info.open {
            display: block;
        }
        #player-info .info-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 14px;
        }
        #player-info .info-row .name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
        }
        #player-info .info-row .meta {
            font-size: 13px;
            color: var(--text2);
        }
        #player-info .info-row .meta .score {
            color: var(--gold);
            font-weight: 600;
        }
        #player-info .line-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 6px;
        }
        #player-info .line-tabs .line-tab {
            padding: 3px 14px;
            border-radius: 14px;
            font-size: 13px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text2);
            cursor: pointer;
            transition: 0.2s;
        }
        #player-info .line-tabs .line-tab:hover {
            border-color: var(--text3);
            color: var(--text);
        }
        #player-info .line-tabs .line-tab.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        /* ============================================================
                   视图容器
                   ============================================================ */
        .page {
            display: none;
            animation: fadeIn 0.25s ease;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px 50px;
            color: var(--text2);
            line-height: 2;
        }
        .empty-state .icon {
            font-size: 40px;
            display: block;
            margin-bottom: 8px;
        }
        .empty-state b {
            color: var(--text);
        }
        .empty-state .hint {
            font-size: 13px;
            color: var(--text3);
        }

        /* ============================================================
                   浏览模式
                   ============================================================ */
        .category-nav {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            padding: 4px 0 12px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .category-nav::-webkit-scrollbar {
            display: none;
        }
        .category-nav .cat {
            flex-shrink: 0;
            padding: 4px 18px;
            border-radius: 20px;
            font-size: 14px;
            color: var(--text2);
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
            border: 1px solid transparent;
        }
        .category-nav .cat:hover {
            color: var(--text);
        }
        .category-nav .cat.active {
            color: var(--primary);
            border-color: var(--primary);
            background: var(--primary-dim);
        }
        .category-nav .cat.kid {
            font-size: 12px;
            padding: 4px 12px;
            opacity: 0.7;
        }

        .browse-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .browse-header .title {
            font-size: 16px;
            font-weight: 600;
        }
        .browse-header .title .badge {
            font-size: 12px;
            font-weight: 400;
            color: var(--text3);
            margin-left: 8px;
        }
        .browse-header .info {
            font-size: 13px;
            color: var(--text3);
        }

        /* ===== 影片网格 ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: 0.25s ease;
            border: 1px solid var(--border);
            position: relative;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 8px 30px rgba(255, 106, 0, 0.12);
        }
        .card .poster-wrap {
            position: relative;
            aspect-ratio: 2/3;
            overflow: hidden;
            background: var(--bg);
        }
        .card .poster-wrap img {
            transition: 0.3s;
        }
        .card:hover .poster-wrap img {
            transform: scale(1.03);
        }
        .card .poster-wrap .play-icon {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: 0.3s;
            font-size: 40px;
            color: #fff;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
        }
        .card:hover .poster-wrap .play-icon {
            opacity: 1;
        }
        .card .poster-wrap .badge-top {
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--primary);
            color: #fff;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }
        .card .poster-wrap .badge-top.score {
            background: var(--gold);
            color: #1a1a2e;
        }

        .card .info {
            padding: 8px 10px 10px;
        }
        .card .info .name {
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card .info .name .star {
            color: var(--gold);
            margin-left: 2px;
        }
        .card .info .meta {
            font-size: 12px;
            color: var(--text2);
            display: flex;
            flex-wrap: wrap;
            gap: 4px 8px;
            margin-top: 4px;
            align-items: center;
        }
        .card .info .meta .tag {
            font-size: 11px;
            padding: 0 8px;
            border-radius: 10px;
            background: var(--primary-dim);
            color: var(--primary);
        }
        .card .info .meta .tag.source {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text3);
        }
        .card .info .meta .score {
            color: var(--gold);
            font-weight: 600;
        }

        .empty-grid {
            text-align: center;
            padding: 60px 20px 50px;
            color: var(--text2);
            line-height: 2;
            grid-column: 1 / -1;
        }

        /* ===== 分页 ===== */
        .pager {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            margin-top: 18px;
            font-size: 13px;
            color: var(--text3);
        }

        /* ============================================================
                   Footer
                   ============================================================ */
        footer {
            text-align: center;
            padding: 24px 16px 6px;
            font-size: 12px;
            color: var(--text3);
            border-top: 1px solid var(--border);
            margin-top: 24px;
        }
        footer a {
            color: var(--text3);
            transition: 0.2s;
        }
        footer a:hover {
            color: var(--text2);
        }
        footer span {
            margin: 0 4px;
        }

        /* ============================================================
                   响应式
                   ============================================================ */
        @media (max-width: 768px) {
            header {
                padding: 6px 10px;
                gap: 4px 8px;
            }
            .logo {
                font-size: 17px;
            }
            .nav-tabs button {
                padding: 3px 12px;
                font-size: 12px;
            }
            .controls select {
                min-width: 60px;
                max-width: 80px;
                font-size: 12px;
                padding: 3px 6px;
            }
            .controls input {
                min-width: 40px;
                font-size: 12px;
                padding: 3px 6px;
            }
            .btn {
                padding: 3px 10px;
                font-size: 12px;
            }
            #status {
                max-width: 70px;
                font-size: 11px;
            }

            .grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 8px;
            }

            .player-controls {
                font-size: 12px;
                padding: 6px 10px;
                gap: 4px 8px;
            }
            .player-controls .speed-group button {
                font-size: 11px;
                padding: 0 5px;
            }

            #toast-container {
                top: 64px;
                right: 8px;
                left: 8px;
                max-width: none;
            }
            .category-nav .cat {
                font-size: 13px;
                padding: 3px 14px;
            }
            #episodes-panel {
                right: 6px;
                min-width: 150px;
                max-width: 200px;
                bottom: 60px;
            }
            #player-info .info-row .name {
                font-size: 14px;
            }
        }

        @media (max-width: 400px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 6px;
            }
            .controls select {
                min-width: 50px;
                max-width: 65px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== Toast ===== -->
    <div id="toast-container"></div>

    <!-- ===== Header ===== -->
    <header>
        <div class="logo">🎬 TV<span>Player</span></div>
        <div class="nav-tabs">
            <button class="active" data-page="browse">浏览</button>
            <button data-page="search">搜索</button>
        </div>
        <div class="controls">
            <select id="sourceSelect"></select>
            <input type="text" id="searchInput" placeholder="搜索片名…" />
            <button class="btn btn-primary" id="searchBtn">搜索</button>
            <span id="status">加载中…</span>
        </div>
    </header>

    <!-- ===== Main ===== -->
    <main>

        <!-- ==========================================================
        播放器
        ========================================================== -->
        <div id="player-section">
            <video id="player" controls preload="metadata" playsinline></video>
            <iframe id="player-iframe" allowfullscreen></iframe>

            <!-- 选集面板（悬浮在右下角） -->
            <div id="episodes-panel">
                <div class="panel-header">
                    <span>📺 选集</span>
                    <button onclick="toggleEpisodesPanel()">✕</button>
                </div>
                <div class="ep-list" id="episodes-list"></div>
            </div>

            <div class="player-controls">
                <span class="title" id="nowPlaying">—</span>
                <div class="speed-group">
                    <button data-speed="0.5">0.5</button>
                    <button data-speed="0.75">0.75</button>
                    <button data-speed="1" class="active">1</button>
                    <button data-speed="1.25">1.25</button>
                    <button data-speed="1.5">1.5</button>
                    <button data-speed="2">2</button>
                </div>
                <button class="ctrl-btn" onclick="toggleEpisodesPanel()" title="选集">📺</button>
                <button class="ctrl-btn" onclick="togglePIP()" title="画中画">📺</button>
                <button class="ctrl-btn" onclick="toggleFullscreen()" title="全屏">⛶</button>
                <input class="link-input" id="m3u8Link" readonly onclick="this.select()" placeholder="m3u8 地址" />
                <button class="btn-ghost" onclick="copyLink()" style="font-size:12px;padding:2px 8px;">复制</button>
                <button class="ctrl-btn close-btn" onclick="closePlayer()" title="收起">✕</button>
            </div>
        </div>

        <!-- 播放器信息栏 -->
        <div id="player-info">
            <div class="info-row">
                <span class="name" id="pInfoName"></span>
                <span class="meta" id="pInfoMeta"></span>
            </div>
            <div class="line-tabs" id="pInfoLines"></div>
        </div>

        <!-- ==========================================================
        PAGE: 浏览
        ========================================================== -->
        <div id="pageBrowse" class="page active">
            <div class="category-nav" id="categoryNav"></div>
            <div class="browse-header">
                <div class="title" id="browseTitle">热门推荐 <span class="badge" id="browseBadge"></span></div>
                <div>
                    <span class="info" id="browseInfo"></span>
                    <button class="btn-ghost" onclick="pagePrev()">‹</button>
                    <span class="info" id="pageInfo">1</span>
                    <button class="btn-ghost" onclick="pageNext()">›</button>
                </div>
            </div>
            <div class="grid" id="browseGrid"></div>
            <div class="pager">
                <button class="btn-ghost" onclick="pagePrev()">‹ 上一页</button>
                <span id="pageInfo2">1</span>
                <button class="btn-ghost" onclick="pageNext()">下一页 ›</button>
            </div>
        </div>

        <!-- ==========================================================
        PAGE: 搜索
        ========================================================== -->
        <div id="pageSearch" class="page">
            <div class="empty-state" id="emptyState">
                <span class="icon">🔍</span>
                输入片名开始搜索<br />
                试试 <b>完美世界</b> · <b>时光代理人</b> · <b>庆余年</b>
                <div class="hint">或切换到「浏览」模式逛一逛</div>
            </div>
            <div class="stats" id="resultStats" style="display:none;"></div>
            <div class="grid" id="searchGrid"></div>
        </div>

    </main>

    <!-- ===== Footer ===== -->
    <footer>
        <span>☁️ Cloudflare Pages</span>
        <span>·</span>
        <a href="#" onclick="showDisclaimer();return false;">免责声明</a>
        <span>·</span>
        <span>仅供学习交流</span>
    </footer>

    <script>
        // ============================================================
        //  CONFIG
        // ============================================================
        const PROXY = (url) => '/api/proxy?url=' + encodeURIComponent(url);
        const CONCURRENCY = 6;
        const FETCH_TIMEOUT = 15000;
        const STORAGE_KEY = 'tv_data';

        // ============================================================
        //  STATE
        // ============================================================
        const state = {
            sources: [],
            source: null,
            category: null,
            page: 1,
            totalPages: 1,
            categories: [],
            movies: [],
            searchResults: [],
            searchSeq: 0,
            // 播放相关
            currentVod: null,
            currentSource: null,
            currentLines: [],
            currentLineIndex: 0,
            currentEpisodes: [],
            currentUrl: '',
            favorites: [],
            history: [],
            currentPage: 'browse',
            isPlaying: false,
        };

        // ============================================================
        //  DOM REFS
        // ============================================================
        const $ = (id) => document.getElementById(id);
        const dom = {
            sourceSelect: $('sourceSelect'),
            searchInput: $('searchInput'),
            searchBtn: $('searchBtn'),
            status: $('status'),

            pageBrowse: $('pageBrowse'),
            pageSearch: $('pageSearch'),

            categoryNav: $('categoryNav'),
            browseGrid: $('browseGrid'),
            browseTitle: $('browseTitle'),
            browseBadge: $('browseBadge'),
            browseInfo: $('browseInfo'),
            pageInfo: $('pageInfo'),
            pageInfo2: $('pageInfo2'),

            emptyState: $('emptyState'),
            searchGrid: $('searchGrid'),
            resultStats: $('resultStats'),

            playerSection: $('player-section'),
            player: $('player'),
            playerIframe: $('player-iframe'),
            nowPlaying: $('nowPlaying'),
            m3u8Link: $('m3u8Link'),
            episodesPanel: $('episodes-panel'),
            episodesList: $('episodes-list'),

            playerInfo: $('player-info'),
            pInfoName: $('pInfoName'),
            pInfoMeta: $('pInfoMeta'),
            pInfoLines: $('pInfoLines'),
        };

        // ============================================================
        //  STORAGE
        // ============================================================
        function loadStorage() {
            try {
                const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                state.favorites = data.favorites || [];
                state.history = data.history || [];
            } catch { state.favorites = [];
                state.history = []; }
        }

        function saveStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                favorites: state.favorites,
                history: state.history,
            }));
        }

        function isFav(vodId, sourceKey) {
            return state.favorites.some(f => f.vodId === vodId && f.sourceKey === sourceKey);
        }

        function toggleFav() {
            if (!state.currentVod || !state.currentSource) return;
            const id = state.currentVod.vod_id;
            const key = state.currentSource.key;
            const idx = state.favorites.findIndex(f => f.vodId === id && f.sourceKey === key);
            if (idx > -1) {
                state.favorites.splice(idx, 1);
                toast('已取消收藏', 'info');
            } else {
                state.favorites.push({ vodId: id, sourceKey: key, name: state.currentVod.vod_name, poster: state
                        .currentVod.vod_pic });
                toast('⭐ 已收藏', 'success');
            }
            saveStorage();
            updatePlayerInfo();
        }

        function addHistory(vod, source, episode) {
            const entry = {
                vodId: vod.vod_id,
                sourceKey: source.key,
                name: vod.vod_name,
                poster: vod.vod_pic,
                episode: episode || '',
                time: Date.now()
            };
            state.history = state.history.filter(h => !(h.vodId === entry.vodId && h.sourceKey === entry.sourceKey));
            state.history.unshift(entry);
            if (state.history.length > 100) state.history.pop();
            saveStorage();
        }

        // ============================================================
        //  TOAST & STATUS
        // ============================================================
        function toast(msg, type = 'info') {
            const c = document.getElementById('toast-container');
            const el = document.createElement('div');
            el.className = 'toast ' + type;
            el.textContent = msg;
            c.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateX(30px)';
                el.style.transition = '0.25s ease';
                setTimeout(() => el.remove(), 280);
            }, 2600);
        }

        function setStatus(msg, loading = false) {
            dom.status.innerHTML = loading ? '<span class="spinner"></span> ' + msg : msg;
        }

        // ============================================================
        //  API
        // ============================================================
        async function fetchProxy(url, timeout = FETCH_TIMEOUT) {
            const ctl = new AbortController();
            const timer = setTimeout(() => ctl.abort(), timeout);
            try {
                const resp = await fetch(PROXY(url), { signal: ctl.signal });
                if (!resp.ok) {
                    const err = await resp.json().catch(() => ({}));
                    throw new Error(err.msg || 'HTTP ' + resp.status);
                }
                return await resp.json();
            } finally {
                clearTimeout(timer);
            }
        }

        function esc(s) {
            if (s == null) return '';
            const d = document.createElement('div');
            d.textContent = String(s);
            return d.innerHTML;
        }

        // ============================================================
        //  INIT
        // ============================================================
        async function init() {
            loadStorage();

            try {
                const resp = await fetch('/sources.json');
                state.sources = await resp.json();
                populateSelect();
                setStatus('就绪');
            } catch (e) {
                setStatus('源列表加载失败');
                toast('源列表加载失败: ' + e.message, 'error');
            }

            const first = state.sources.find(s => s.group === 'stable') || state.sources[0];
            if (first) {
                dom.sourceSelect.value = first.key;
                await loadBrowse(first);
            }

            // ---- 事件绑定 ----
            // 源切换：如果在播放中，自动关闭播放器并返回浏览
            dom.sourceSelect.addEventListener('change', () => {
                const s = getSelectedSource();
                if (!s) return;

                // 如果播放器开着，关掉
                if (state.isPlaying) {
                    closePlayer();
                }

                // 如果在搜索页，切到浏览
                if (state.currentPage === 'search') {
                    document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active'));
                    document.querySelector('[data-page="browse"]').classList.add('active');
                }

                switchPage('browse');
                loadBrowse(s);
            });

            dom.searchBtn.addEventListener('click', doSearch);
            dom.searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });

            // 导航切换
            document.querySelectorAll('.nav-tabs button').forEach(btn => {
                btn.addEventListener('click', () => {
                    const page = btn.dataset.page;
                    document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    // 如果播放器开着，关掉
                    if (state.isPlaying) {
                        closePlayer();
                    }
                    switchPage(page);
                });
            });

            document.addEventListener('keydown', handleKeydown);

            // 倍速
            document.querySelector('.speed-group').addEventListener('click', (e) => {
                const btn = e.target.closest('button');
                if (!btn || !btn.dataset.speed) return;
                const speed = parseFloat(btn.dataset.speed);
                dom.player.playbackRate = speed;
                document.querySelectorAll('.speed-group button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                toast(speed + '×', 'info');
            });

            // 点击选集面板外部关闭
            document.addEventListener('click', (e) => {
                const panel = dom.episodesPanel;
                if (panel.style.display === 'block') {
                    if (!panel.contains(e.target) && !e.target.closest('.ctrl-btn') && !e.target.closest(
                            '#episodesToggle')) {
                        panel.style.display = 'none';
                    }
                }
            });

            switchPage('browse');
        }

        function getSelectedSource() {
            const key = dom.sourceSelect.value;
            return state.sources.find(s => s.key === key) || null;
        }

        function populateSelect() {
            const sel = dom.sourceSelect;
            sel.innerHTML = '';
            const groups = { stable: [], normal: [], backup: [] };
            state.sources.forEach(s => {
                const g = s.group || 'normal';
                if (groups[g]) groups[g].push(s);
                else groups.normal.push(s);
            });
            const labels = { stable: '稳定', normal: '普通', backup: '备用' };
            Object.keys(groups).forEach(g => {
                if (!groups[g].length) return;
                const og = document.createElement('optgroup');
                og.label = labels[g] || g;
                groups[g].forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.key;
                    opt.textContent = s.name;
                    og.appendChild(opt);
                });
                sel.appendChild(og);
            });
        }

        // ============================================================
        //  PAGE SWITCH
        // ============================================================
        function switchPage(page) {
            state.currentPage = page;
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            if (page === 'browse') {
                dom.pageBrowse.classList.add('active');
                if (state.source) loadBrowse(state.source);
            } else if (page === 'search') {
                dom.pageSearch.classList.add('active');
                dom.searchInput.focus();
            }
        }

        // ============================================================
        //  BROWSE
        // ============================================================
        async function loadBrowse(source) {
            if (!source) return;
            state.source = source;
            state.category = null;
            state.page = 1;
            setStatus('加载中…', true);
            dom.categoryNav.innerHTML = '<span style="color:var(--text3);padding:4px 0;">加载分类…</span>';

            await loadMovies();

            try {
                const data = await fetchProxy(source.api + '?ac=list');
                const classes = data.class || [];
                state.categories = classes;
                renderCategories(classes);
            } catch (e) {
                dom.categoryNav.innerHTML = '';
            }
            setStatus(source.name + ' · 就绪');
        }

        async function loadMovies() {
            const s = state.source;
            if (!s) return;
            const url = state.category ?
                `${s.api}?ac=videolist&t=${state.category}&pg=${state.page}` :
                `${s.api}?ac=videolist&pg=${state.page}`;

            dom.browseGrid.innerHTML = '<div class="empty-grid"><span class="spinner"></span> 加载中…</div>';

            try {
                const data = await fetchProxy(url);
                const list = data.list || [];
                state.totalPages = Math.max(1, parseInt(data.pagecount) || 1);
                state.movies = list;
                renderMovies(list);
                updatePager();
                dom.browseInfo.textContent = `${list.length} 部`;
                dom.browseBadge.textContent = `共 ${state.totalPages} 页`;
            } catch (e) {
                dom.browseGrid.innerHTML = `<div class="empty-grid">❌ ${esc(e.message)}</div>`;
                toast('加载失败: ' + e.message, 'error');
            }
        }

        function renderMovies(list) {
            const grid = dom.browseGrid;
            if (!list.length) {
                grid.innerHTML = '<div class="empty-grid">📭 暂无内容</div>';
                return;
            }
            const frag = document.createDocumentFragment();
            list.forEach(v => {
                const el = document.createElement('div');
                el.className = 'card';
                const poster = v.vod_pic || '';
                const score = v.vod_score || '';
                const remark = v.vod_remarks || '';
                el.innerHTML = `
                    <div class="poster-wrap">
                        <img loading="lazy" src="${esc(poster)}" 
                             onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22260%22 height=%22390%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%23181e2a%22/%3E%3C/svg%3E'" />
                        <div class="play-icon">▶</div>
                        ${score ? `<div class="badge-top score">${esc(score)}</div>` : ''}
                        ${remark && !score ? `<div class="badge-top">${esc(remark)}</div>` : ''}
                    </div>
                    <div class="info">
                        <div class="name">${esc(v.vod_name)}</div>
                        <div class="meta">
                            <span class="tag">${esc(v.type_name || '影视')}</span>
                            ${score ? `<span class="score">${esc(score)}</span>` : ''}
                        </div>
                    </div>
                `;
                el.onclick = () => playMovie(v, state.source);
                frag.appendChild(el);
            });
            grid.innerHTML = '';
            grid.appendChild(frag);
        }

        function renderCategories(classes) {
            const top = classes.filter(c => String(c.type_pid) === '0');
            const kids = classes.filter(c => String(c.type_pid) !== '0');
            const nav = dom.categoryNav;
            nav.innerHTML = '';

            const all = document.createElement('span');
            all.className = 'cat active';
            all.textContent = '全部';
            all.onclick = () => {
                document.querySelectorAll('.category-nav .cat').forEach(c => c.classList.remove('active'));
                all.classList.add('active');
                state.category = null;
                state.page = 1;
                loadMovies();
            };
            nav.appendChild(all);

            top.forEach(c => {
                const btn = document.createElement('span');
                btn.className = 'cat';
                btn.textContent = c.type_name;
                btn.onclick = () => {
                    document.querySelectorAll('.category-nav .cat').forEach(c => c.classList.remove('active'));
                    btn.classList.add('active');
                    state.category = c.type_id;
                    state.page = 1;
                    loadMovies();
                };
                nav.appendChild(btn);
                kids.filter(k => String(k.type_pid) === String(c.type_id)).forEach(k => {
                    const kb = document.createElement('span');
                    kb.className = 'cat kid';
                    kb.textContent = '└ ' + k.type_name;
                    kb.onclick = () => {
                        document.querySelectorAll('.category-nav .cat').forEach(c => c.classList.remove('active'));
                        kb.classList.add('active');
                        state.category = k.type_id;
                        state.page = 1;
                        loadMovies();
                    };
                    nav.appendChild(kb);
                });
            });
            dom.browseTitle.textContent = state.source ? state.source.name : '热门推荐';
        }

        function updatePager() {
            const txt = `${state.page}/${state.totalPages}`;
            dom.pageInfo.textContent = txt;
            dom.pageInfo2.textContent = txt;
        }

        function pagePrev() { if (state.page > 1) { state.page--;
                loadMovies(); } }

        function pageNext() { if (state.page < state.totalPages) { state.page++;
                loadMovies(); } }

        // ============================================================
        //  SEARCH
        // ============================================================
        async function doSearch() {
            const q = dom.searchInput.value.trim();
            if (!q) { toast('请输入片名', 'error'); return; }

            const sel = dom.sourceSelect;
            const targets = sel.value === '__all__' ?
                state.sources :
                state.sources.filter(s => s.key === sel.value);
            if (!targets.length) { toast('请选择有效源', 'error'); return; }

            document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active'));
            document.querySelector('[data-page="search"]').classList.add('active');
            switchPage('search');

            dom.emptyState.style.display = 'none';
            dom.resultStats.style.display = 'block';
            dom.searchGrid.innerHTML = '';
            dom.resultStats.textContent = '搜索中…';

            const mySeq = ++state.searchSeq;
            const results = [];
            const pool = targets.slice();
            let done = 0;

            const render = () => {
                const frag = document.createDocumentFragment();
                results.forEach(({ v, s }) => {
                    const el = document.createElement('div');
                    el.className = 'card';
                    const fav = isFav(v.vod_id, s.key);
                    const poster = v.vod_pic || '';
                    const score = v.vod_score || '';
                    el.innerHTML = `
                        <div class="poster-wrap">
                            <img loading="lazy" src="${esc(poster)}" 
                                 onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22260%22 height=%22390%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%23181e2a%22/%3E%3C/svg%3E'" />
                            <div class="play-icon">▶</div>
                            ${score ? `<div class="badge-top score">${esc(score)}</div>` : ''}
                        </div>
                        <div class="info">
                            <div class="name">${esc(v.vod_name)}${fav ? ' <span class="star">⭐</span>' : ''}</div>
                            <div class="meta">
                                <span class="tag">${esc(v.type_name || '影视')}</span>
                                <span class="tag source">${esc(s.name)}</span>
                                ${v.vod_remarks ? `<span>${esc(v.vod_remarks)}</span>` : ''}
                                ${score ? `<span class="score">${esc(score)}</span>` : ''}
                            </div>
                        </div>
                    `;
                    el.onclick = () => playMovie(v, s);
                    frag.appendChild(el);
                });
                dom.searchGrid.innerHTML = '';
                dom.searchGrid.appendChild(frag);
                dom.resultStats.textContent =
                    `找到 ${results.length} 个结果 · 完成 ${done}/${targets.length} 个源`;
            };

            async function worker() {
                while (pool.length && mySeq === state.searchSeq) {
                    const s = pool.shift();
                    try {
                        const url = s.api + '?ac=detail&wd=' + encodeURIComponent(q);
                        const data = await fetchProxy(url);
                        (data.list || []).forEach(v => {
                            if (v && v.vod_id && v.vod_name) {
                                if (!results.some(r => r.v.vod_id === v.vod_id && r.s.key === s.key)) {
                                    results.push({ v, s });
                                }
                            }
                        });
                    } catch (e) { /* skip */ }
                    done++;
                    render();
                }
            }

            const workers = Array.from({ length: Math.min(CONCURRENCY, targets.length) }, worker);
            await Promise.all(workers);
            if (mySeq !== state.searchSeq) return;
            render();
            if (!results.length) {
                dom.resultStats.textContent = '未找到结果，试试其他关键词';
                toast('未找到结果', 'error');
            }
        }

        // ============================================================
        //  核心播放逻辑（点击卡片直接播放，爱奇艺风格）
        // ============================================================
        async function playMovie(vod, source) {
            state.currentVod = vod;
            state.currentSource = source;

            setStatus('加载播放地址…', true);
            toast('加载播放地址…', 'info');

            try {
                const data = await fetchProxy(source.api + '?ac=detail&ids=' + vod.vod_id);
                const detail = data.list?.[0] || vod;

                // 解析线路
                let froms = [],
                    urls = [];
                const playFrom = detail.vod_play_from || '';
                const playUrl = detail.vod_play_url || '';

                if (playFrom && playUrl) {
                    froms = playFrom.split('$$$').filter(Boolean);
                    urls = playUrl.split('$$$').filter(Boolean);
                }

                if (!froms.length) {
                    const keys = Object.keys(detail).filter(k => k.startsWith('vod_play_from'));
                    for (const k of keys) {
                        const idx = k.replace('vod_play_from', '');
                        const f = detail[k] || '';
                        const u = detail['vod_play_url' + idx] || '';
                        if (f && u) {
                            froms.push(f);
                            urls.push(u);
                        }
                    }
                }

                const lines = froms.map((f, i) => ({ name: f, url: urls[i] || '' }))
                    .filter(l => l.url.trim());

                // m3u8 优先
                lines.sort((a, b) => (a.url.includes('.m3u8') ? 0 : 1) - (b.url.includes('.m3u8') ? 0 : 1));

                if (!lines.length) {
                    toast('该源无可用播放地址', 'error');
                    setStatus('无播放地址');
                    return;
                }

                state.currentLines = lines;
                state.currentLineIndex = 0;

                // 显示播放器
                showPlayer(vod, detail);

                // 解析第一线路的第一集
                const firstUrl = lines[0].url;
                const episodes = parseEpisodes(firstUrl);

                if (episodes.length) {
                    state.currentEpisodes = episodes;
                    const firstEp = episodes[0];
                    const fullUrl = normalizeUrl(firstEp.url);
                    startPlayer(fullUrl, vod.vod_name + ' ' + firstEp.name);
                    renderEpisodesPanel(episodes);
                } else {
                    const fullUrl = normalizeUrl(firstUrl);
                    startPlayer(fullUrl, vod.vod_name);
                    renderEpisodesPanel([]);
                }

                // 渲染线路切换
                renderPlayerLines(lines);

                setStatus('播放中');
            } catch (e) {
                toast('获取播放地址失败: ' + e.message, 'error');
                setStatus('加载失败');
            }
        }

        function parseEpisodes(url) {
            const parts = url.split('#').filter(p => p.includes('$'));
            if (!parts.length) {
                const fullUrl = normalizeUrl(url);
                return [{ name: '播放', url: fullUrl }];
            }
            return parts.map(p => {
                const i = p.indexOf('$');
                const name = p.slice(0, i).trim() || '播放';
                let addr = p.slice(i + 1);
                return { name, url: normalizeUrl(addr) };
            });
        }

        function normalizeUrl(url) {
            let result = url.trim();
            if (result.startsWith('/')) {
                const source = state.currentSource;
                if (source) {
                    const base = source.api.replace(/\/api\.php.*$/, '');
                    result = base + result;
                }
            }
            return result;
        }

        // ============================================================
        //  显示播放器（爱奇艺风格）
        // ============================================================
        function showPlayer(vod, detail) {
            state.isPlaying = true;

            // 展开播放器
            dom.playerSection.classList.add('open');

            // 更新信息栏
            const score = vod.vod_score ? `豆瓣评分 ${vod.vod_score}` : '';
            dom.pInfoName.textContent = vod.vod_name;
            dom.pInfoMeta.textContent = [
                vod.type_name, vod.vod_year, vod.vod_area,
                score,
                '主演: ' + (vod.vod_actor || '-'),
                '导演: ' + (vod.vod_director || '-')
            ].filter(Boolean).join(' · ');

            dom.playerInfo.classList.add('open');

            // 滚动到播放器
            dom.playerSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function renderPlayerLines(lines) {
            const container = dom.pInfoLines;
            container.innerHTML = '';
            lines.forEach((l, i) => {
                const tab = document.createElement('span');
                tab.className = 'line-tab' + (i === state.currentLineIndex ? ' active' : '');
                tab.textContent = l.name;
                tab.onclick = () => {
                    document.querySelectorAll('#pInfoLines .line-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    state.currentLineIndex = i;
                    const episodes = parseEpisodes(lines[i].url);
                    state.currentEpisodes = episodes;
                    renderEpisodesPanel(episodes);
                    if (episodes.length) {
                        const first = episodes[0];
                        startPlayer(first.url, (state.currentVod?.vod_name || '') + ' ' + first.name);
                    }
                };
                container.appendChild(tab);
            });
        }

        function updatePlayerInfo() {
            if (state.currentVod) {
                const fav = isFav(state.currentVod.vod_id, state.currentSource?.key);
                const name = state.currentVod.vod_name + (fav ? ' ⭐' : '');
                dom.pInfoName.textContent = name;
            }
        }

        // ============================================================
        //  选集面板
        // ============================================================
        function toggleEpisodesPanel() {
            const panel = dom.episodesPanel;
            if (panel.style.display === 'block') {
                panel.style.display = 'none';
            } else {
                panel.style.display = 'block';
                // 如果当前没有剧集，尝试从当前线路解析
                if (!state.currentEpisodes.length && state.currentLines.length) {
                    const url = state.currentLines[state.currentLineIndex]?.url || '';
                    const eps = parseEpisodes(url);
                    state.currentEpisodes = eps;
                    renderEpisodesPanel(eps);
                }
            }
        }

        function renderEpisodesPanel(episodes) {
            const list = dom.episodesList;
            list.innerHTML = '';
            if (!episodes || !episodes.length) {
                list.innerHTML = '<span class="ep-loading">暂无剧集</span>';
                return;
            }
            episodes.forEach((ep, idx) => {
                const el = document.createElement('span');
                el.className = 'ep';
                if (idx === 0 && state.currentEpisodes.length) {
                    // 不自动标记激活，由点击时标记
                }
                el.textContent = ep.name;
                el.onclick = () => {
                    document.querySelectorAll('#episodes-list .ep').forEach(e => e.classList.remove('active'));
                    el.classList.add('active');
                    startPlayer(ep.url, (state.currentVod?.vod_name || '') + ' ' + ep.name);
                    // 自动关闭面板
                    dom.episodesPanel.style.display = 'none';
                    if (state.currentVod && state.currentSource) {
                        addHistory(state.currentVod, state.currentSource, ep.name);
                    }
                };
                list.appendChild(el);
            });
        }

        // ============================================================
        //  核心播放引擎
        // ============================================================
        function startPlayer(url, title) {
            if (!url || !url.trim()) {
                toast('播放地址为空', 'error');
                return;
            }

            url = url.trim();

            // ---- 处理相对路径 ----
            if (url.startsWith('/')) {
                const source = state.currentSource;
                if (source) {
                    const base = source.api.replace(/\/api\.php.*$/, '');
                    url = base + url;
                }
            }

            state.currentUrl = url;

            // ---- 更新 UI ----
            dom.nowPlaying.textContent = title || '正在播放';
            dom.m3u8Link.value = url;

            // 关闭 iframe
            dom.playerIframe.style.display = 'none';
            dom.playerIframe.src = '';
            dom.player.style.display = 'block';

            if (window.hls) {
                window.hls.destroy();
                window.hls = null;
            }

            const video = dom.player;
            video.removeAttribute('src');
            video.load();

            // ---- 判断是否为 HTML 播放页 ----
            const isHtml = url.includes('.html') ||
                url.includes('/play/') ||
                (!url.includes('.m3u8') && !url.includes('.mp4') && !url.includes('.ts') && !url.includes('.flv') && !url
                    .includes('.mkv'));

            if (isHtml) {
                extractM3u8FromHtml(url, title);
                return;
            }

            // ---- m3u8 播放 ----
            if (url.includes('.m3u8') || url.includes('.m3u8?')) {
                if (window.Hls && Hls.isSupported()) {
                    const hls = new Hls({ enableWorker: true });
                    window.hls = hls;
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
                    hls.on(Hls.Events.ERROR, (e, data) => {
                        if (data.fatal) {
                            toast('HLS 播放失败，尝试嵌入', 'error');
                            startPlayerInIframe(url, title);
                        }
                    });
                    toast('▶ 开始播放', 'success');
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                    video.play().catch(() => {});
                } else {
                    startPlayerInIframe(url, title);
                }
                return;
            }

            // ---- 普通视频直链 ----
            video.src = url;
            video.play().catch(() => {
                toast('无法直接播放，尝试嵌入', 'error');
                startPlayerInIframe(url, title);
            });
            toast('▶ 开始播放', 'success');
        }

        // ============================================================
        //  从 HTML 播放页提取 m3u8
        // ============================================================
        async function extractM3u8FromHtml(pageUrl, title) {
            toast('正在解析播放地址…', 'info');
            setStatus('解析中…', true);

            try {
                if (pageUrl.startsWith('/')) {
                    const source = state.currentSource;
                    if (source) {
                        const base = source.api.replace(/\/api\.php.*$/, '');
                        pageUrl = base + pageUrl;
                    }
                }

                const resp = await fetchProxy(pageUrl);
                const html = typeof resp === 'string' ? resp : JSON.stringify(resp);

                const patterns = [
                    /["'](https?:[^"']+\.m3u8[^"']*)["']/,
                    /["'](\/[^"']+\.m3u8[^"']*)["']/,
                    /var\s+url\s*=\s*["']([^"']+\.m3u8[^"']*)["']/,
                    /url\s*[:=]\s*["']([^"']+\.m3u8[^"']*)["']/i,
                    /src\s*[:=]\s*["']([^"']+\.m3u8[^"']*)["']/i,
                    /(https?:[^\s"']+\.m3u8[^\s"']*)/,
                    /(\/[^\s"']+\.m3u8[^\s"']*)/,
                ];

                let m3u8Url = null;
                for (const pattern of patterns) {
                    const match = html.match(pattern);
                    if (match) {
                        m3u8Url = match[1];
                        break;
                    }
                }

                if (m3u8Url) {
                    if (m3u8Url.startsWith('/')) {
                        const base = new URL(pageUrl).origin;
                        m3u8Url = base + m3u8Url;
                    }
                    if (!m3u8Url.startsWith('http://') && !m3u8Url.startsWith('https://')) {
                        const base = pageUrl.replace(/\/[^/]*$/, '/');
                        m3u8Url = base + m3u8Url;
                    }
                    toast('✅ 解析成功', 'success');
                    setStatus('就绪');
                    startPlayer(m3u8Url, title || '解析播放');
                } else {
                    toast('未能提取 m3u8，尝试嵌入页面', 'info');
                    startPlayerInIframe(pageUrl, title);
                }
            } catch (e) {
                toast('解析失败: ' + e.message, 'error');
                setStatus('解析失败');
                startPlayerInIframe(pageUrl, title);
            }
        }

        // ============================================================
        //  iframe 备选播放
        // ============================================================
        function startPlayerInIframe(url, title) {
            dom.playerSection.classList.add('open');
            dom.nowPlaying.textContent = title || '嵌入播放';
            dom.m3u8Link.value = url;

            dom.player.style.display = 'none';
            dom.playerIframe.style.display = 'block';
            dom.playerIframe.src = url;

            toast('已切换到嵌入式播放', 'info');
            dom.playerSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // ============================================================
        //  播放器控制
        // ============================================================
        function closePlayer() {
            state.isPlaying = false;
            dom.playerSection.classList.remove('open');
            dom.playerInfo.classList.remove('open');
            dom.episodesPanel.style.display = 'none';

            if (window.hls) {
                window.hls.destroy();
                window.hls = null;
            }
            dom.player.removeAttribute('src');
            dom.player.load();
            dom.player.style.display = 'block';
            dom.playerIframe.style.display = 'none';
            dom.playerIframe.src = '';
            dom.nowPlaying.textContent = '—';
            dom.m3u8Link.value = '';

            state.currentLines = [];
            state.currentEpisodes = [];
        }

        function copyLink() {
            const input = dom.m3u8Link;
            input.select();
            navigator.clipboard?.writeText(input.value).then(() => toast('已复制', 'success'))
                .catch(() => toast('请手动复制', 'info'));
        }

        function togglePIP() {
            const video = dom.player;
            if (document.pictureInPictureElement) {
                document.exitPictureInPicture();
            } else if (document.pictureInPictureEnabled) {
                video.requestPictureInPicture().catch(() => {});
            }
        }

        function toggleFullscreen() {
            const wrap = dom.playerSection;
            if (!document.fullscreenElement) {
                wrap.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen();
            }
        }

        // ============================================================
        //  KEYBOARD
        // ============================================================
        function handleKeydown(e) {
            const tag = e.target.tagName;
            if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;

            const video = dom.player;
            if (dom.playerSection.classList.contains('open') && video) {
                switch (e.key) {
                    case ' ':
                        e.preventDefault();
                        video.paused ? video.play() : video.pause();
                        break;
                    case 'ArrowRight':
                        e.preventDefault();
                        video.currentTime += 10;
                        break;
                    case 'ArrowLeft':
                        e.preventDefault();
                        video.currentTime -= 10;
                        break;
                    case 'f':
                    case 'F':
                        toggleFullscreen();
                        break;
                    case 'p':
                    case 'P':
                        togglePIP();
                        break;
                    case 'Escape':
                        if (document.fullscreenElement) document.exitFullscreen();
                        break;
                }
            }

            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                document.querySelector('[data-page="search"]').click();
                dom.searchInput.focus();
                dom.searchInput.select();
            }

            if (e.key === 'Escape' && state.currentPage === 'detail') {
                backFromDetail();
            }
        }

        function backFromDetail() {
            // 保留兼容
        }

        // ============================================================
        //  BOOT
        // ============================================================
        document.addEventListener('DOMContentLoaded', init);
    </script>
