<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TVPlayer · 云端影视</title>
    <script src="/hls.min.js"></script>
    <style>
        /* ============================================================
                   爱奇艺风格 · 从零重构
                   ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #0a0c12;
            --header-bg: #11161f;
            --card-bg: #181e2a;
            --card-hover: #212837;
            --border: #2a3242;
            --text: #eef1f5;
            --text2: #8991a8;
            --text3: #4a5368;
            --primary: #ff6a00;
            --primary-dim: rgba(255, 106, 0, 0.15);
            --gold: #f5b342;
            --green: #2ed573;
            --radius: 8px;
            --shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        button {
            cursor: pointer;
            border: none;
            outline: none;
            background: none;
            color: inherit;
            font: inherit;
        }
        input,
        select {
            font: inherit;
            outline: none;
            border: none;
            background: none;
            color: inherit;
        }
        img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--text3);
            border-radius: 4px;
        }

        /* ===== Toast ===== */
        #toast-container {
            position: fixed;
            top: 72px;
            right: 16px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 340px;
            pointer-events: none;
        }
        .toast {
            padding: 10px 16px;
            border-radius: 6px;
            background: var(--header-bg);
            border: 1px solid var(--border);
            color: var(--text2);
            font-size: 13px;
            box-shadow: var(--shadow);
            pointer-events: auto;
            animation: toastIn 0.25s ease;
        }
        .toast.success {
            border-left: 3px solid var(--green);
            color: var(--text);
        }
        .toast.error {
            border-left: 3px solid #e74c3c;
            color: var(--text);
        }
        .toast.info {
            border-left: 3px solid var(--primary);
            color: var(--text);
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ===== Header ===== */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border);
            padding: 8px 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 12px;
        }
        .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            white-space: nowrap;
            letter-spacing: -0.3px;
            cursor: pointer;
            transition: 0.2s;
        }
        .logo:hover {
            color: var(--primary);
        }
        .logo span {
            color: var(--primary);
        }

        .controls {
            display: flex;
            flex: 1;
            min-width: 160px;
            align-items: center;
            gap: 6px;
        }
        .controls select {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 13px;
            color: var(--text);
            min-width: 70px;
            max-width: 120px;
            cursor: pointer;
        }
        .controls select option {
            background: var(--header-bg);
        }
        .controls input {
            flex: 1;
            min-width: 50px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 13px;
            color: var(--text);
            transition: 0.2s;
        }
        .controls input:focus {
            border-color: var(--primary);
        }
        .controls input::placeholder {
            color: var(--text3);
        }

        .btn {
            padding: 4px 14px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            transition: 0.2s;
            white-space: nowrap;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            opacity: 0.85;
        }
        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-ghost {
            color: var(--text2);
            border: 1px solid transparent;
            padding: 3px 10px;
        }
        .btn-ghost:hover {
            color: var(--text);
            border-color: var(--border);
        }
        .btn-danger {
            color: #e74c3c;
        }
        .btn-danger:hover {
            color: #ff6b6b;
        }
        .btn-sm {
            padding: 1px 8px;
            font-size: 12px;
            border-radius: 4px;
        }

        #status {
            font-size: 12px;
            color: var(--text3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 120px;
            margin-left: auto;
        }
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== Main ===== */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 12px 16px 0;
        }

        /* ============================================================
                   播放器
                   ============================================================ */
        #player-section {
            display: none;
            min-height: 300px;
            background: #000;
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
            position: relative;
        }
        #player-section.open {
            display: block;
        }
        #player-section video {
            width: 100%;
            height: 100%;
            min-height: 300px;
            max-height: 58vh;
            background: #0a0c12;
            display: block;
        }
        #player-iframe {
            width: 100%;
            height: 58vh;
            border: none;
            display: none;
            background: #000;
        }

        /* ===== 加载遮罩 ===== */
        #player-loading {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            background: #0a0c12;
            color: var(--text2);
            z-index: 5;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        #player-loading.show {
            display: flex;
        }
        #player-loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #player-loading .spinner {
            width: 36px;
            height: 36px;
            border-width: 3px;
        }
        #player-loading .label {
            font-size: 14px;
            color: var(--text3);
            letter-spacing: 0.5px;
        }

        /* ===== 隐藏视频默认控件占位 ===== */
        #player-section video {
            background: #0a0c12;
            min-height: 300px;
        }
        #player::-webkit-media-controls-start-playback-button {
            display: none !important;
        }

        .player-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 12px;
            padding: 8px 14px;
            background: rgba(0, 0, 0, 0.9);
            border-top: 1px solid var(--border);
            font-size: 13px;
            color: var(--text2);
        }
        .player-controls .title {
            flex: 1;
            min-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text);
            font-size: 14px;
        }
        .player-controls select#lineSelect {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 12px;
            color: var(--text);
            max-width: 100px;
            display: none;
            cursor: pointer;
        }
        .player-controls select#lineSelect option {
            background: var(--header-bg);
        }
        .player-controls .ctrl-btn {
            padding: 2px 6px;
            font-size: 18px;
            color: var(--text3);
            border-radius: 4px;
            transition: 0.2s;
            line-height: 1.4;
        }
        .player-controls .ctrl-btn:hover {
            color: var(--text);
            background: var(--card-bg);
        }
        .player-controls .ctrl-btn.close-btn:hover {
            color: #e74c3c;
        }
        .player-controls .link-input {
            flex: 1;
            min-width: 100px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 12px;
            color: var(--text3);
        }
        .player-controls .link-input:focus {
            border-color: var(--primary);
        }

        /* ===== 选集面板 ===== */
        #episodes-panel {
            display: none;
            position: absolute;
            bottom: 70px;
            right: 12px;
            background: rgba(0, 0, 0, 0.92);
            border-radius: 8px;
            padding: 12px 14px;
            max-height: 320px;
            overflow-y: auto;
            min-width: 180px;
            max-width: 260px;
            z-index: 20;
            border: 1px solid var(--border);
            backdrop-filter: blur(8px);
        }
        #episodes-panel::-webkit-scrollbar {
            width: 3px;
        }
        #episodes-panel::-webkit-scrollbar-thumb {
            background: var(--text3);
            border-radius: 4px;
        }
        #episodes-panel .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            color: var(--text2);
            font-size: 13px;
            font-weight: 500;
        }
        #episodes-panel .panel-header button {
            color: var(--text3);
            font-size: 16px;
            padding: 0 4px;
        }
        #episodes-panel .panel-header button:hover {
            color: var(--text);
        }
        #episodes-panel .ep-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        #episodes-panel .ep-list .ep {
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 13px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text2);
            cursor: pointer;
            transition: 0.2s;
            min-width: 36px;
            text-align: center;
        }
        #episodes-panel .ep-list .ep:hover {
            border-color: var(--text3);
            color: var(--text);
        }
        #episodes-panel .ep-list .ep.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }
        #episodes-panel .ep-list .ep-loading {
            color: var(--text3);
            font-size: 13px;
            padding: 4px 0;
        }

        /* ============================================================
                   视图容器
                   ============================================================ */
        .page {
            display: none;
            animation: fadeIn 0.25s ease;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px 50px;
            color: var(--text2);
            line-height: 2;
        }
        .empty-state .icon {
            font-size: 40px;
            display: block;
            margin-bottom: 8px;
        }
        .empty-state b {
            color: var(--text);
        }
        .empty-state .hint {
            font-size: 13px;
            color: var(--text3);
        }

        /* ============================================================
                   浏览模式
                   ============================================================ */
        .category-nav {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            padding: 4px 0 12px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .category-nav::-webkit-scrollbar {
            display: none;
        }
        .category-nav .cat {
            flex-shrink: 0;
            padding: 4px 18px;
            border-radius: 20px;
            font-size: 14px;
            color: var(--text2);
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
            border: 1px solid transparent;
        }
        .category-nav .cat:hover {
            color: var(--text);
        }
        .category-nav .cat.active {
            color: var(--primary);
            border-color: var(--primary);
            background: var(--primary-dim);
        }
        .category-nav .cat.kid {
            font-size: 12px;
            padding: 4px 12px;
            opacity: 0.7;
        }

        .browse-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .browse-header .title {
            font-size: 16px;
            font-weight: 600;
        }
        .browse-header .title .badge {
            font-size: 12px;
            font-weight: 400;
            color: var(--text3);
            margin-left: 8px;
        }
        .browse-header .info {
            font-size: 13px;
            color: var(--text3);
        }

        /* ===== 影片网格 ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: 0.25s ease;
            border: 1px solid var(--border);
            position: relative;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 8px 30px rgba(255, 106, 0, 0.12);
        }
        .card .poster-wrap {
            position: relative;
            aspect-ratio: 2/3;
            overflow: hidden;
            background: var(--bg);
        }
        .card .poster-wrap img {
            transition: 0.3s;
        }
        .card:hover .poster-wrap img {
            transform: scale(1.03);
        }
        .card .poster-wrap .play-icon {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: 0.3s;
            font-size: 40px;
            color: #fff;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
        }
        .card:hover .poster-wrap .play-icon {
            opacity: 1;
        }
        .card .poster-wrap .badge-top {
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--primary);
            color: #fff;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }
        .card .poster-wrap .badge-top.score {
            background: var(--gold);
            color: #1a1a2e;
        }

        .card .info {
            padding: 8px 10px 10px;
        }
        .card .info .name {
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card .info .name .star {
            color: var(--gold);
            margin-left: 2px;
        }
        .card .info .meta {
            font-size: 12px;
            color: var(--text2);
            display: flex;
            flex-wrap: wrap;
            gap: 4px 8px;
            margin-top: 4px;
            align-items: center;
        }
        .card .info .meta .tag {
            font-size: 11px;
            padding: 0 8px;
            border-radius: 10px;
            background: var(--primary-dim);
            color: var(--primary);
        }
        .card .info .meta .tag.source {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text3);
        }
        .card .info .meta .score {
            color: var(--gold);
            font-weight: 600;
        }

        .empty-grid {
            text-align: center;
            padding: 60px 20px 50px;
            color: var(--text2);
            line-height: 2;
            grid-column: 1 / -1;
        }

        /* ===== 分页 ===== */
        .pager {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            margin-top: 18px;
            font-size: 13px;
            color: var(--text3);
        }

        /* ============================================================
                   导入弹窗
                   ============================================================ */
        #importModal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 999;
            background: rgba(0, 0, 0, 0.7);
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        #importModal.open {
            display: flex;
        }
        .import-box {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            max-width: 700px;
            width: 94%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .import-box h3 {
            font-size: 18px;
            margin-bottom: 4px;
        }
        .import-box .sub {
            color: var(--text2);
            font-size: 13px;
            margin-bottom: 12px;
        }
        .import-box textarea {
            width: 100%;
            height: 120px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            color: var(--text);
            font-size: 13px;
            font-family: 'Courier New', monospace;
            resize: vertical;
        }
        .import-box textarea:focus {
            border-color: var(--primary);
        }
        .import-box .actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .import-box .hint {
            margin-top: 12px;
            font-size: 12px;
            color: var(--text3);
            line-height: 1.6;
        }
        .import-box .hint a {
            color: var(--primary);
            cursor: pointer;
        }
        .import-box .hint a:hover {
            text-decoration: underline;
        }
        .import-box .source-count {
            font-size: 13px;
            color: var(--text2);
            margin-top: 8px;
            padding: 6px 12px;
            background: var(--bg);
            border-radius: 4px;
            display: inline-block;
        }

        /* 已有源列表 */
        .source-list {
            margin-top: 14px;
            border-top: 1px solid var(--border);
            padding-top: 12px;
            max-height: 240px;
            overflow-y: auto;
        }
        .source-list .group-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text2);
            margin: 8px 0 4px;
            padding: 2px 0;
        }
        .source-list .group-label:first-child {
            margin-top: 0;
        }
        .source-list .source-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 13px;
            gap: 6px;
            transition: 0.2s;
        }
        .source-list .source-item:hover {
            background: var(--card-bg);
        }
        .source-list .source-item .s-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text);
        }
        .source-list .source-item .s-key {
            font-size: 11px;
            color: var(--text3);
            margin-right: 6px;
        }
        .source-list .source-item .s-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .source-list .source-item .s-actions button {
            padding: 1px 8px;
            font-size: 12px;
            border-radius: 4px;
            transition: 0.2s;
        }
        .source-list .source-item .s-actions .edit-btn {
            color: var(--primary);
        }
        .source-list .source-item .s-actions .edit-btn:hover {
            background: var(--primary-dim);
        }
        .source-list .source-item .s-actions .del-btn {
            color: #e74c3c;
        }
        .source-list .source-item .s-actions .del-btn:hover {
            background: rgba(231, 76, 60, 0.15);
        }
        .source-list .empty-hint {
            color: var(--text3);
            font-size: 13px;
            padding: 8px 0;
            text-align: center;
        }

        /* ============================================================
                   Footer
                   ============================================================ */
        footer {
            text-align: center;
            padding: 24px 16px 6px;
            font-size: 12px;
            color: var(--text3);
            border-top: 1px solid var(--border);
            margin-top: 24px;
        }
        footer a {
            color: var(--text3);
            transition: 0.2s;
        }
        footer a:hover {
            color: var(--text2);
        }
        footer span {
            margin: 0 4px;
        }

        /* ============================================================
                   响应式
                   ============================================================ */
        @media (max-width: 768px) {
            header {
                padding: 6px 10px;
                gap: 4px 8px;
            }
            .logo {
                font-size: 17px;
            }
            .controls select {
                min-width: 60px;
                max-width: 80px;
                font-size: 12px;
                padding: 3px 6px;
            }
            .controls input {
                min-width: 40px;
                font-size: 12px;
                padding: 3px 6px;
            }
            .btn {
                padding: 3px 10px;
                font-size: 12px;
            }
            #status {
                max-width: 70px;
                font-size: 11px;
            }

            .grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 8px;
            }

            .player-controls {
                font-size: 12px;
                padding: 6px 10px;
                gap: 4px 8px;
            }
            .player-controls select#lineSelect {
                max-width: 70px;
                font-size: 11px;
            }
            #player-section {
                min-height: 200px;
            }
            #player-section video {
                min-height: 200px;
                max-height: 40vh;
            }
            #player-iframe {
                height: 40vh;
            }

            #toast-container {
                top: 64px;
                right: 8px;
                left: 8px;
                max-width: none;
            }
            .category-nav .cat {
                font-size: 13px;
                padding: 3px 14px;
            }
            #episodes-panel {
                right: 6px;
                min-width: 150px;
                max-width: 200px;
                bottom: 60px;
            }
            .import-box {
                padding: 16px;
                max-width: 95%;
            }
            .import-box textarea {
                height: 100px;
            }
            .source-list {
                max-height: 160px;
            }
            .source-list .source-item {
                font-size: 12px;
                padding: 3px 4px;
                flex-wrap: wrap;
            }
            .source-list .source-item .s-name {
                min-width: 60px;
            }
        }

        @media (max-width: 400px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 6px;
            }
            .controls select {
                min-width: 50px;
                max-width: 65px;
            }
            .player-controls select#lineSelect {
                max-width: 55px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== Toast ===== -->
    <div id="toast-container"></div>

    <!-- ===== Header ===== -->
    <header>
        <div class="logo" onclick="switchToBrowse()">🎬 TV<span>Player</span></div>
        <div class="controls">
            <select id="sourceSelect"><option value="">请导入源</option></select>
            <input type="text" id="searchInput" placeholder="搜索片名…" disabled />
            <button class="btn btn-primary" id="searchBtn" disabled onclick="doSearch()">搜索</button>
            <button class="btn-ghost" onclick="showImportModal()" title="导入源" style="font-size:18px;padding:0 6px;">📥</button>
            <span id="status">请导入源</span>
        </div>
    </header>

    <!-- ===== Main ===== -->
    <main>

        <!-- ==========================================================
        播放器
        ========================================================== -->
        <div id="player-section">
            <!-- 加载遮罩 -->
            <div id="player-loading" class="show">
                <span class="spinner"></span>
                <span class="label">加载中…</span>
            </div>

            <video id="player" controls preload="metadata" playsinline></video>
            <iframe id="player-iframe" allowfullscreen></iframe>

            <!-- 选集面板 -->
            <div id="episodes-panel">
                <div class="panel-header">
                    <span>📺 选集</span>
                    <button onclick="toggleEpisodesPanel()">✕</button>
                </div>
                <div class="ep-list" id="episodes-list"></div>
            </div>

            <div class="player-controls">
                <span class="title" id="nowPlaying">—</span>
                <select id="lineSelect" onchange="switchPlayerLine(this.value)"></select>
                <button class="ctrl-btn" onclick="toggleEpisodesPanel()" title="选集">📺</button>
                <input class="link-input" id="m3u8Link" readonly onclick="this.select()" placeholder="m3u8 地址" />
                <button class="ctrl-btn close-btn" onclick="closePlayer()" title="收起">✕</button>
            </div>
        </div>

        <!-- ==========================================================
        PAGE: 浏览
        ========================================================== -->
        <div id="pageBrowse" class="page active">
            <div class="category-nav" id="categoryNav"></div>
            <div class="browse-header" id="browseHeader">
                <div class="title" id="browseTitle">热门推荐 <span class="badge" id="browseBadge"></span></div>
                <div>
                    <span class="info" id="browseInfo"></span>
                    <button class="btn-ghost" onclick="pagePrev()">‹</button>
                    <span class="info" id="pageInfo">1</span>
                    <button class="btn-ghost" onclick="pageNext()">›</button>
                </div>
            </div>
            <div class="grid" id="browseGrid"></div>
            <div class="pager" id="browsePager">
                <button class="btn-ghost" onclick="pagePrev()">‹ 上一页</button>
                <span id="pageInfo2">1</span>
                <button class="btn-ghost" onclick="pageNext()">下一页 ›</button>
            </div>
        </div>

        <!-- ==========================================================
        PAGE: 搜索
        ========================================================== -->
        <div id="pageSearch" class="page">
            <div class="empty-state" id="emptyState">
                <span class="icon">🔍</span>
                输入片名开始搜索<br />
                试试 <b>完美世界</b> · <b>时光代理人</b> · <b>庆余年</b>
                <div class="hint">或切换到「浏览」模式逛一逛</div>
            </div>
            <div class="stats" id="resultStats" style="display:none;"></div>
            <div class="grid" id="searchGrid"></div>
        </div>

    </main>

    <!-- ============================================================
    导入弹窗（含已有源列表）
    ============================================================ -->
    <div id="importModal">
        <div class="import-box">
            <h3>📥 源管理</h3>
            <div class="sub">粘贴 JSON 格式的源列表导入，或管理已有源</div>

            <!-- 已有源列表 -->
            <div class="source-list" id="sourceList"></div>

            <!-- 导入区域 -->
            <div style="margin-top:12px;border-top:1px solid var(--border);padding-top:12px;">
                <div style="font-size:13px;color:var(--text2);margin-bottom:6px;">📝 导入 / 编辑源（JSON 格式）</div>
                <textarea id="importTextarea" placeholder='[\n  {\n    "key": "唯一ID",\n    "name": "显示名称",\n    "api": "接口地址",\n    "type": 0,\n    "searchable": 1,\n    "filterable": 1,\n    "playerType": 1,\n    "group": "stable"\n  }\n]'></textarea>
                <div class="source-count" id="importCount">当前源：0 个</div>
                <div class="actions">
                    <button class="btn-primary" onclick="importSources()">✅ 导入 / 更新</button>
                    <button class="btn-ghost" onclick="document.getElementById('fileInput').click()">📂 上传 JSON 文件</button>
                    <input type="file" id="fileInput" accept=".json" style="display:none" onchange="importFromFile(event)" />
                    <button class="btn-ghost" onclick="closeImportModal()" style="margin-left:auto;">关闭</button>
                </div>
                <div class="hint">
                    💡 <a onclick="loadExample()">加载示例</a> ｜
                    📖 格式：<code>[{"key":"唯一ID","name":"显示名称","api":"接口地址","group":"stable|normal|backup"}]</code>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== Footer ===== -->
    <footer>
        <span>☁️ Cloudflare Pages</span>
        <span>·</span>
        <a href="#" onclick="showDisclaimer();return false;">免责声明</a>
        <span>·</span>
        <span>源由用户自行导入</span>
    </footer>

    <script>
        // ============================================================
        //  CONFIG
        // ============================================================
        const PROXY = (url) => '/api/proxy?url=' + encodeURIComponent(url);
        const CONCURRENCY = 6;
        const FETCH_TIMEOUT = 15000;
        const STORAGE_KEY = 'tv_data';
        const STORAGE_SOURCES_KEY = 'tv_sources';
        const STORAGE_DISCLAIMER_KEY = 'tv_disclaimer_agreed';

        // ============================================================
        //  STATE
        // ============================================================
        const state = {
            sources: [],
            source: null,
            category: null,
            page: 1,
            totalPages: 1,
            categories: [],
            movies: [],
            searchResults: [],
            searchSeq: 0,
            currentVod: null,
            currentSource: null,
            currentLines: [],
            currentLineIndex: 0,
            currentEpisodes: [],
            currentUrl: '',
            favorites: [],
            history: [],
            isPlaying: false,
            isLoading: false,
            editingKey: null,
        };

        // ============================================================
        //  DOM REFS
        // ============================================================
        const $ = (id) => document.getElementById(id);
        const dom = {
            sourceSelect: $('sourceSelect'),
            searchInput: $('searchInput'),
            searchBtn: $('searchBtn'),
            status: $('status'),

            pageBrowse: $('pageBrowse'),
            pageSearch: $('pageSearch'),

            categoryNav: $('categoryNav'),
            browseGrid: $('browseGrid'),
            browseTitle: $('browseTitle'),
            browseBadge: $('browseBadge'),
            browseInfo: $('browseInfo'),
            pageInfo: $('pageInfo'),
            pageInfo2: $('pageInfo2'),
            browseHeader: $('browseHeader'),
            browsePager: $('browsePager'),

            emptyState: $('emptyState'),
            searchGrid: $('searchGrid'),
            resultStats: $('resultStats'),

            playerSection: $('player-section'),
            player: $('player'),
            playerIframe: $('player-iframe'),
            nowPlaying: $('nowPlaying'),
            m3u8Link: $('m3u8Link'),
            lineSelect: $('lineSelect'),
            episodesPanel: $('episodes-panel'),
            episodesList: $('episodes-list'),

            importModal: $('importModal'),
            importTextarea: $('importTextarea'),
            importCount: $('importCount'),
            sourceList: $('sourceList'),

            playerLoading: $('player-loading'),
        };

        // ============================================================
        //  STORAGE
        // ============================================================
        function loadStorage() {
            try {
                const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                state.favorites = data.favorites || [];
                state.history = data.history || [];
            } catch { state.favorites = [];
                state.history = []; }
        }

        function saveStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                favorites: state.favorites,
                history: state.history,
            }));
        }

        function isFav(vodId, sourceKey) {
            return state.favorites.some(f => f.vodId === vodId && f.sourceKey === sourceKey);
        }

        function toggleFav() {
            if (!state.currentVod || !state.currentSource) return;
            const id = state.currentVod.vod_id;
            const key = state.currentSource.key;
            const idx = state.favorites.findIndex(f => f.vodId === id && f.sourceKey === key);
            if (idx > -1) {
                state.favorites.splice(idx, 1);
                toast('已取消收藏', 'info');
            } else {
                state.favorites.push({ vodId: id, sourceKey: key, name: state.currentVod.vod_name, poster: state
                        .currentVod.vod_pic });
                toast('⭐ 已收藏', 'success');
            }
            saveStorage();
        }

        function addHistory(vod, source, episode) {
            const entry = {
                vodId: vod.vod_id,
                sourceKey: source.key,
                name: vod.vod_name,
                poster: vod.vod_pic,
                episode: episode || '',
                time: Date.now()
            };
            state.history = state.history.filter(h => !(h.vodId === entry.vodId && h.sourceKey === entry.sourceKey));
            state.history.unshift(entry);
            if (state.history.length > 100) state.history.pop();
            saveStorage();
        }

        // ============================================================
        //  SOURCES 管理
        // ============================================================
        function getStoredSources() {
            try {
                const stored = localStorage.getItem(STORAGE_SOURCES_KEY);
                if (stored) {
                    const parsed = JSON.parse(stored);
                    if (Array.isArray(parsed) && parsed.length) {
                        return parsed;
                    }
                }
            } catch (e) {}
            return null;
        }

        function setStoredSources(sources) {
            localStorage.setItem(STORAGE_SOURCES_KEY, JSON.stringify(sources));
        }

        async function loadSources() {
            const stored = getStoredSources();
            if (stored) {
                return stored;
            }
            return [];
        }

        function hasSources() {
            return state.sources && state.sources.length > 0;
        }

        // ============================================================
        //  源列表渲染（弹窗内）
        // ============================================================
        function renderSourceList() {
            const container = dom.sourceList;
            const sources = getStoredSources() || [];

            if (!sources.length) {
                container.innerHTML = '<div class="empty-hint">📭 暂无源，请导入</div>';
                dom.importCount.textContent = '当前源：0 个';
                return;
            }

            const groups = { stable: [], normal: [], backup: [] };
            sources.forEach(s => {
                const g = s.group || 'normal';
                if (groups[g]) groups[g].push(s);
                else groups.normal.push(s);
            });
            const labels = { stable: '🟢 稳定', normal: '🔵 普通', backup: '🟡 备用' };

            let html = '';
            Object.keys(groups).forEach(g => {
                if (!groups[g].length) return;
                html += `<div class="group-label">${labels[g] || g}</div>`;
                groups[g].forEach(s => {
                    const isEditing = state.editingKey === s.key;
                    html += `
                        <div class="source-item" style="${isEditing ? 'background:var(--primary-dim);' : ''}">
                            <span class="s-name">${esc(s.name)} <span class="s-key">(${esc(s.key)})</span></span>
                            <div class="s-actions">
                                <button class="edit-btn btn-sm" onclick="editSource('${esc(s.key)}')">✏️</button>
                                <button class="del-btn btn-sm" onclick="deleteSource('${esc(s.key)}')">🗑️</button>
                            </div>
                        </div>
                    `;
                });
            });

            container.innerHTML = html;
            dom.importCount.textContent = `当前源：${sources.length} 个`;
        }

        // ============================================================
        //  编辑源
        // ============================================================
        function editSource(key) {
            const sources = getStoredSources() || [];
            const item = sources.find(s => s.key === key);
            if (!item) {
                toast('未找到该源', 'error');
                return;
            }
            state.editingKey = key;
            dom.importTextarea.value = JSON.stringify(item, null, 2);
            renderSourceList();
            dom.importTextarea.focus();
            toast('已加载到编辑区，修改后点击「导入 / 更新」保存', 'info');
        }

        // ============================================================
        //  删除源
        // ============================================================
        function deleteSource(key) {
            if (!confirm(`确定要删除源 "${key}" 吗？`)) return;
            const sources = getStoredSources() || [];
            const filtered = sources.filter(s => s.key !== key);
            if (filtered.length === sources.length) {
                toast('未找到该源', 'error');
                return;
            }
            setStoredSources(filtered);
            state.sources = filtered;
            if (state.editingKey === key) {
                state.editingKey = null;
                dom.importTextarea.value = '';
            }
            renderSourceList();
            populateSelect();
            if (!filtered.length) {
                renderEmptyState();
            } else {
                const first = filtered.find(s => s.group === 'stable') || filtered[0];
                if (first) {
                    dom.sourceSelect.value = first.key;
                    loadBrowse(first);
                }
            }
            toast('✅ 已删除', 'success');
        }

        // ============================================================
        //  导入功能
        // ============================================================
        function showImportModal() {
            dom.importModal.classList.add('open');
            renderSourceList();
            if (!state.editingKey) {
                dom.importTextarea.value = '';
            }
        }

        function closeImportModal() {
            dom.importModal.classList.remove('open');
            state.editingKey = null;
            dom.importTextarea.value = '';
        }

        function importSources() {
            const raw = dom.importTextarea.value.trim();
            if (!raw) { toast('请粘贴 JSON 内容', 'error'); return; }

            try {
                const data = JSON.parse(raw);
                if (!Array.isArray(data) || !data.length) {
                    throw new Error('格式错误：需要非空数组');
                }
                for (const item of data) {
                    if (!item.key || !item.name || !item.api) {
                        throw new Error('每个源必须包含 key, name, api 字段');
                    }
                }

                let currentSources = getStoredSources() || [];
                if (state.editingKey) {
                    const idx = currentSources.findIndex(s => s.key === state.editingKey);
                    if (idx > -1) {
                        currentSources[idx] = data[0];
                    } else {
                        currentSources.push(data[0]);
                    }
                    state.editingKey = null;
                    setStoredSources(currentSources);
                    toast('✅ 更新成功', 'success');
                } else {
                    setStoredSources(data);
                    toast('✅ 导入成功，' + data.length + ' 个源', 'success');
                }

                state.sources = getStoredSources() || [];
                closeImportModal();
                location.reload();
            } catch (e) {
                toast('JSON 格式错误: ' + e.message, 'error');
            }
        }

        function importFromFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!Array.isArray(data) || !data.length) {
                        throw new Error('格式错误：需要非空数组');
                    }
                    for (const item of data) {
                        if (!item.key || !item.name || !item.api) {
                            throw new Error('每个源必须包含 key, name, api 字段');
                        }
                    }
                    setStoredSources(data);
                    state.sources = data;
                    toast('✅ 导入成功，' + data.length + ' 个源', 'success');
                    closeImportModal();
                    location.reload();
                } catch (err) {
                    toast('文件解析失败: ' + err.message, 'error');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function loadExample() {
            const example = [
                { key: 'feifan', name: '非凡资源', api: 'http://ffzy5.tv/api.php/provide/vod', type: 0, searchable: 1,
                    filterable: 1, playerType: 1, group: 'stable' },
                { key: 'wolong', name: '卧龙资源', api: 'https://wolongzyw.com/api.php/provide/vod', type: 0, searchable: 1,
                    filterable: 1, playerType: 1, group: 'stable' },
                { key: 'zuida', name: '最大资源', api: 'https://api.zuidapi.com/api.php/provide/vod', type: 0, searchable: 1,
                    filterable: 1, playerType: 1, group: 'stable' }
            ];
            dom.importTextarea.value = JSON.stringify(example, null, 2);
            state.editingKey = null;
            renderSourceList();
            toast('示例已填入，点击「导入 / 更新」即可', 'info');
        }

        // ============================================================
        //  TOAST & STATUS
        // ============================================================
        function toast(msg, type = 'info') {
            const c = document.getElementById('toast-container');
            const el = document.createElement('div');
            el.className = 'toast ' + type;
            el.textContent = msg;
            c.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateX(30px)';
                el.style.transition = '0.25s ease';
                setTimeout(() => el.remove(), 280);
            }, 2600);
        }

        function setStatus(msg, loading = false) {
            dom.status.innerHTML = loading ? '<span class="spinner"></span> ' + msg : msg;
        }

        function esc(s) {
            if (s == null) return '';
            const d = document.createElement('div');
            d.textContent = String(s);
            return d.innerHTML;
        }

        // ============================================================
        //  API
        // ============================================================
        async function fetchProxy(url, timeout = FETCH_TIMEOUT) {
            const ctl = new AbortController();
            const timer = setTimeout(() => ctl.abort(), timeout);
            try {
                const resp = await fetch(PROXY(url), { signal: ctl.signal });
                if (!resp.ok) {
                    const err = await resp.json().catch(() => ({}));
                    throw new Error(err.msg || 'HTTP ' + resp.status);
                }
                return await resp.json();
            } finally {
                clearTimeout(timer);
            }
        }

        // ============================================================
        //  ENABLE/DISABLE CONTROLS
        // ============================================================
        function setControlsEnabled(enabled) {
            dom.searchInput.disabled = !enabled;
            dom.searchBtn.disabled = !enabled;
            if (!enabled) {
                dom.searchInput.placeholder = '请先导入源';
            } else {
                dom.searchInput.placeholder = '搜索片名…';
            }
        }

        // ============================================================
        //  RENDER EMPTY STATE
        // ============================================================
        function renderEmptyState() {
            const grid = dom.browseGrid;
            grid.innerHTML = `
                <div class="empty-grid" style="grid-column:1/-1;padding:80px 20px;text-align:center;">
                    <div style="font-size:56px;margin-bottom:16px;">📥</div>
                    <div style="font-size:20px;font-weight:700;margin-bottom:8px;color:var(--text);">还没有影视源</div>
                    <div style="color:var(--text2);margin-bottom:16px;font-size:15px;">点击右上角「📥」按钮，导入你的源列表</div>
                    <button class="btn-primary" onclick="showImportModal()" style="font-size:15px;padding:8px 24px;">📥 导入源</button>
                    <div style="margin-top:12px;font-size:13px;color:var(--text3);">
                        或 <a onclick="loadExample()" style="color:var(--primary);cursor:pointer;">加载示例源</a> 快速体验
                    </div>
                </div>
            `;
            dom.categoryNav.innerHTML = '';
            dom.browseTitle.textContent = '📥 请导入源';
            dom.browseBadge.textContent = '';
            dom.browseInfo.textContent = '';
            dom.pageInfo.textContent = '-';
            dom.pageInfo2.textContent = '-';
            dom.sourceSelect.innerHTML = '<option value="">请导入源</option>';
            dom.sourceSelect.disabled = true;
            setStatus('请导入源');
            setControlsEnabled(false);
        }

        // ============================================================
        //  PLAYER LOADING 控制
        // ============================================================
        function showPlayerLoading() {
            dom.playerLoading.classList.remove('hidden');
            dom.playerLoading.classList.add('show');
        }

        function hidePlayerLoading() {
            dom.playerLoading.classList.add('hidden');
            setTimeout(() => {
                dom.playerLoading.classList.remove('show');
            }, 400);
        }

        // ============================================================
        //  切换到浏览模式（点击 Logo 触发）
        // ============================================================
        function switchToBrowse() {
            if (state.isPlaying) closePlayer();
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            dom.pageBrowse.classList.add('active');
            if (state.source) loadBrowse(state.source);
        }

        // ============================================================
        //  线路切换
        // ============================================================
        function switchPlayerLine(index) {
            index = parseInt(index);
            state.currentLineIndex = index;
            const lines = state.currentLines;
            if (!lines || !lines[index]) return;
            const episodes = parseEpisodes(lines[index].url);
            state.currentEpisodes = episodes;
            renderEpisodesPanel(episodes);
            if (episodes.length) {
                const first = episodes[0];
                startPlayer(first.url, (state.currentVod?.vod_name || '') + ' ' + first.name);
            }
            toast('已切换: ' + lines[index].name, 'info');
        }

        // ============================================================
        //  INIT
        // ============================================================
        async function init() {
            loadStorage();

            try {
                state.sources = await loadSources();
            } catch (e) {
                state.sources = [];
            }

            if (!hasSources()) {
                renderEmptyState();
                setTimeout(showDisclaimer, 500);
                dom.importModal.addEventListener('click', (e) => {
                    if (e.target === dom.importModal) closeImportModal();
                });
                document.addEventListener('keydown', handleKeydown);
                return;
            }

            populateSelect();
            setControlsEnabled(true);
            setStatus('就绪');

            const first = state.sources.find(s => s.group === 'stable') || state.sources[0];
            if (first) {
                dom.sourceSelect.value = first.key;
                dom.sourceSelect.disabled = false;
                await loadBrowse(first);
            }

            dom.pageBrowse.classList.add('active');

            dom.sourceSelect.addEventListener('change', () => {
                const s = getSelectedSource();
                if (!s) return;
                if (state.isPlaying) closePlayer();
                dom.pageBrowse.classList.add('active');
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                loadBrowse(s);
            });

            });

                    opt.value = s.key;
                    opt.textContent = s.name;

        // ============================================================
        //  SEARCH
        // ============================================================
        async function doSearch() {
            if (!hasSources()) {
                toast('请先导入源', 'error');
                return;
            }

            const q = dom.searchInput.value.trim();
            if (!q) { toast('请输入片名', 'error'); return; }

            const sel = dom.sourceSelect;
            const targets = sel.value === '__all__' ?
                state.sources :
                state.sources.filter(s => s.key === sel.value);
            if (!targets.length) { toast('请选择有效源', 'error'); return; }

            // 切换到搜索页
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            dom.pageSearch.classList.add('active');

            dom.emptyState.style.display = 'none';
            dom.resultStats.style.display = 'block';
            dom.searchGrid.innerHTML = '';
            dom.resultStats.textContent = '搜索中…';

            const mySeq = ++state.searchSeq;
            const results = [];
            const pool = targets.slice();
            let done = 0;

            const render = () => {
                const frag = document.createDocumentFragment();
                results.forEach(({ v, s }) => {
                    const el = document.createElement('div');
                    el.className = 'card';
                    const fav = isFav(v.vod_id, s.key);
                    const poster = v.vod_pic || '';
                    const score = v.vod_score || '';
                    el.innerHTML = `
                        <div class="poster-wrap">
                            <img loading="lazy" src="${esc(poster)}" 
                                 onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22260%22 height=%22390%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%23181e2a%22/%3E%3C/svg%3E'" />
                            <div class="play-icon">▶</div>
                            ${score ? `<div class="badge-top score">${esc(score)}</div>` : ''}
                        </div>
                        <div class="info">
                            <div class="name">${esc(v.vod_name)}${fav ? ' <span class="star">⭐</span>' : ''}</div>
                            <div class="meta">
                                <span class="tag">${esc(v.type_name || '影视')}</span>
                                <span class="tag source">${esc(s.name)}</span>
                                ${v.vod_remarks ? `<span>${esc(v.vod_remarks)}</span>` : ''}
                                ${score ? `<span class="score">${esc(score)}</span>` : ''}
                            </div>
                        </div>
                    `;
                    el.onclick = () => playMovie(v, s);
                    frag.appendChild(el);
                });
                dom.searchGrid.innerHTML = '';
                dom.searchGrid.appendChild(frag);
                dom.resultStats.textContent =
                    `找到 ${results.length} 个结果 · 完成 ${done}/${targets.length} 个源`;
            };

            async function worker() {
                while (pool.length && mySeq === state.searchSeq) {
                    const s = pool.shift();
                    try {
                        const url = s.api + '?ac=detail&wd=' + encodeURIComponent(q);
                        const data = await fetchProxy(url);
                        (data.list || []).forEach(v => {
                            if (v && v.vod_id && v.vod_name) {
                                if (!results.some(r => r.v.vod_id === v.vod_id && r.s.key === s.key)) {
                                    results.push({ v, s });
                                }
                            }
                        });
                    } catch (e) { /* skip */ }
                    done++;
                    render();
                }
            }

            const workers = Array.from({ length: Math.min(CONCURRENCY, targets.length) }, worker);
            await Promise.all(workers);
            if (mySeq !== state.searchSeq) return;
            render();
            if (!results.length) {
                dom.resultStats.textContent = '未找到结果，试试其他关键词';
                toast('未找到结果', 'error');
            }
        }

        async function playMovie(vod, source) {
            state.currentVod = vod;
            state.currentSource = source;

            setStatus('加载播放地址…', true);

            hideAllContent();
            showPlayerLoading();

            try {
                const data = await fetchProxy(source.api + '?ac=detail&ids=' + vod.vod_id);
                const detail = data.list?.[0] || vod;

                let froms = [],
                    urls = [];
                const playFrom = detail.vod_play_from || '';
                const playUrl = detail.vod_play_url || '';

                if (playFrom && playUrl) {
                    froms = playFrom.split('$$$').filter(Boolean);
                    urls = playUrl.split('$$$').filter(Boolean);
                }

                if (!froms.length) {
                    const keys = Object.keys(detail).filter(k => k.startsWith('vod_play_from'));
                    for (const k of keys) {
                        const idx = k.replace('vod_play_from', '');
                        const f = detail[k] || '';
                        const u = detail['vod_play_url' + idx] || '';
                        if (f && u) {
                            froms.push(f);
                            urls.push(u);
                        }
                    }
                }

                const lines = froms.map((f, i) => ({ name: f, url: urls[i] || '' }))
                    .filter(l => l.url.trim());

                lines.sort((a, b) => (a.url.includes('.m3u8') ? 0 : 1) - (b.url.includes('.m3u8') ? 0 : 1));

                if (!lines.length) {
                    toast('该源无可用播放地址', 'error');
                    setStatus('无播放地址');
                    hidePlayerLoading();
                    restoreAllContent();
                    return;
                }

                state.currentLines = lines;
                state.currentLineIndex = 0;

                showPlayer();

                const firstUrl = lines[0].url;
                const episodes = parseEpisodes(firstUrl);

                if (episodes.length) {
                    state.currentEpisodes = episodes;
                    const firstEp = episodes[0];
                    const fullUrl = normalizeUrl(firstEp.url);
                    startPlayer(fullUrl, vod.vod_name + ' ' + firstEp.name);
                    renderEpisodesPanel(episodes);
                } else {
                    const fullUrl = normalizeUrl(firstUrl);
                    startPlayer(fullUrl, vod.vod_name);
                    renderEpisodesPanel([]);
                }

                renderPlayerLines(lines);

                setStatus('播放中');
            } catch (e) {
                toast('获取播放地址失败: ' + e.message, 'error');
                setStatus('加载失败');
                hidePlayerLoading();
                restoreAllContent();
            }
        }

        function parseEpisodes(url) {
            const parts = url.split('#').filter(p => p.includes('$'));
            if (!parts.length) {
                const fullUrl = normalizeUrl(url);
                return [{ name: '播放', url: fullUrl }];
            }
            return parts.map(p => {
                const i = p.indexOf('$');
                const name = p.slice(0, i).trim() || '播放';
                let addr = p.slice(i + 1);
                return { name, url: normalizeUrl(addr) };
            });
        }

        function normalizeUrl(url) {
            let result = url.trim();
            if (result.startsWith('/')) {
                const source = state.currentSource;
                if (source) {
                    const base = source.api.replace(/\/api\.php.*$/, '');
                    result = base + result;
                }
            }
            return result;
        }

        // ============================================================
        //  核心播放引擎
        // ============================================================
        function startPlayer(url, title) {
            if (!url || !url.trim()) {
                toast('播放地址为空', 'error');
                return;
            }

            url = url.trim();

            if (url.startsWith('/')) {
                const source = state.currentSource;
                if (source) {
                    const base = source.api.replace(/\/api\.php.*$/, '');
                    url = base + url;
                }
            }

            state.currentUrl = url;

            dom.nowPlaying.textContent = title || '正在播放';
            dom.m3u8Link.value = url;

            dom.playerIframe.style.display = 'none';
            dom.playerIframe.src = '';
            dom.player.style.display = 'block';

            if (window.hls) {
                window.hls.destroy();
                window.hls = null;
            }

            const video = dom.player;
            video.removeAttribute('src');
            video.load();

            const isHtml = url.includes('.html') ||
                url.includes('/play/') ||
                (!url.includes('.m3u8') && !url.includes('.mp4') && !url.includes('.ts') && !url.includes('.flv') && !url
                    .includes('.mkv'));

            if (isHtml) {
                extractM3u8FromHtml(url, title);
                return;
            }

            if (url.includes('.m3u8') || url.includes('.m3u8?')) {
                if (window.Hls && Hls.isSupported()) {
                    const hls = new Hls({ enableWorker: true });
                    window.hls = hls;
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
                    hls.on(Hls.Events.ERROR, (e, data) => {
                        if (data.fatal) {
                            toast('HLS 播放失败，尝试嵌入', 'error');
                            startPlayerInIframe(url, title);
                        }
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                    video.play().catch(() => {});
                } else {
                    startPlayerInIframe(url, title);
                }
                return;
            }

            video.src = url;
            video.play().catch(() => {
                toast('无法直接播放，尝试嵌入', 'error');
                startPlayerInIframe(url, title);
            });
        }

        // ============================================================
        //  从 HTML 提取 m3u8
        // ============================================================
        async function extractM3u8FromHtml(pageUrl, title) {
            setStatus('解析中…', true);

            try {
                if (pageUrl.startsWith('/')) {
                    const source = state.currentSource;
                    if (source) {
                        const base = source.api.replace(/\/api\.php.*$/, '');
                        pageUrl = base + pageUrl;
                    }
                }

                const resp = await fetchProxy(pageUrl);
                const html = typeof resp === 'string' ? resp : JSON.stringify(resp);

                const patterns = [
                    /["'](https?:[^"']+\.m3u8[^"']*)["']/,
                    /["'](\/[^"']+\.m3u8[^"']*)["']/,
                    /var\s+url\s*=\s*["']([^"']+\.m3u8[^"']*)["']/,
                    /url\s*[:=]\s*["']([^"']+\.m3u8[^"']*)["']/i,
                    /src\s*[:=]\s*["']([^"']+\.m3u8[^"']*)["']/i,
                    /(https?:[^\s"']+\.m3u8[^\s"']*)/,
                    /(\/[^\s"']+\.m3u8[^\s"']*)/,
                ];

                let m3u8Url = null;
                for (const pattern of patterns) {
                    const match = html.match(pattern);
                    if (match) {
                        m3u8Url = match[1];
                        break;
                    }
                }

                if (m3u8Url) {
                    if (m3u8Url.startsWith('/')) {
                        const base = new URL(pageUrl).origin;
                        m3u8Url = base + m3u8Url;
                    }
                    if (!m3u8Url.startsWith('http://') && !m3u8Url.startsWith('https://')) {
                        const base = pageUrl.replace(/\/[^/]*$/, '/');
                        m3u8Url = base + m3u8Url;
                    }
                    toast('✅ 解析成功', 'success');
                    setStatus('就绪');
                    startPlayer(m3u8Url, title || '解析播放');
                } else {
                    toast('未能提取 m3u8，尝试嵌入页面', 'info');
                    startPlayerInIframe(pageUrl, title);
                }
            } catch (e) {
                toast('解析失败: ' + e.message, 'error');
                setStatus('解析失败');
                startPlayerInIframe(pageUrl, title);
            }
        }

        // ============================================================

            dom.playerSection.classList.add('open');
            dom.nowPlaying.textContent = title || '嵌入播放';
            dom.m3u8Link.value = url;

            dom.player.style.display = 'none';

        // ============================================================
        //  KEYBOARD
        // ============================================================
        function handleKeydown(e) {
            const tag = e.target.tagName;
            if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;

            const video = dom.player;
            if (dom.playerSection.classList.contains('open') && video) {
                switch (e.key) {
                    case ' ':
                        e.preventDefault();
                        video.paused ? video.play() : video.pause();
                        break;
                    case 'ArrowRight':
                        e.preventDefault();
                        video.currentTime += 10;
                        break;
                    case 'ArrowLeft':
                        e.preventDefault();
                        video.currentTime -= 10;
                        break;
                    case 'Escape':
                        if (document.fullscreenElement) document.exitFullscreen();
                        break;
                }
            }

            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                dom.searchInput.focus();
                dom.searchInput.select();
            }
        }

        // ============================================================
        //  DISCLAIMER
        // ============================================================
        let disclaimerShown = false;

                '5. 使用本工具产生的一切法律风险由使用者自行承担。\n\n' +
                '点击「确定」表示您同意上述条款。'
